[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vrtmap"
version = "0.1.0"
description = "VRT-organized web vulnerability scanner, mapped to the Bugcrowd Vulnerability Rating Taxonomy."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27,<0.29",
    "beautifulsoup4>=4.12,<5",
]

[project.optional-dependencies]
# dnspython enables the SPF/DMARC and DNS-hygiene checks; skipped if absent.
dns = ["dnspython>=2.4"]
dev = ["pytest>=7"]

# Command:  vrtmap <url> --authorized [options]
[project.scripts]
vrtmap = "vrtmap.cli:main"

[tool.setuptools]
# The VRT catalog lives at the repo root (vrt_catalog/), so use an editable
# install — pip install -e . — which keeps that path valid.
packages = ["vrtmap"]
